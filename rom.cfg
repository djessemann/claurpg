# EREBUS — MMC1 (mapper 1), 128K PRG (8x16K), 128K CHR (32x4K)
# Banks 0-6 at $8000 are switchable data banks; bank 7 fixed at $C000 = code.
MEMORY {
    ZP:   start = $00,   size = $100,  type = rw, file = "";
    OAM:  start = $0200, size = $100,  type = rw, file = "";
    RAM:  start = $0300, size = $0500, type = rw, file = "";

    HDR:  start = $0000, size = $10,   type = ro, file = %O, fill = yes;

    PRG0: start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1: start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG2: start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG3: start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG4: start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG5: start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG6: start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRGF: start = $C000, size = $3FFA, type = ro, file = %O, fill = yes, fillval = $FF;
    VEC:  start = $FFFA, size = $6,    type = ro, file = %O, fill = yes;

    CHR:  start = $0000, size = $20000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    HEADER:   load = HDR,  type = ro;
    ZEROPAGE: load = ZP,   type = zp;
    OAMSEG:   load = OAM,   type = bss, align = $100, optional = yes;
    BSS:      load = RAM,  type = bss;

    BANK0:    load = PRG0, type = ro, optional = yes;
    BANK1:    load = PRG1, type = ro, optional = yes;
    BANK2:    load = PRG2, type = ro, optional = yes;
    BANK3:    load = PRG3, type = ro, optional = yes;
    BANK4:    load = PRG4, type = ro, optional = yes;
    BANK5:    load = PRG5, type = ro, optional = yes;
    BANK6:    load = PRG6, type = ro, optional = yes;

    CODE:     load = PRGF, type = ro;
    RODATA:   load = PRGF, type = ro;
    VECTORS:  load = VEC,  type = ro;

    CHARS:    load = CHR,  type = ro;
}
